<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>avtorizacia</title>
    <link rel="stylesheet" href="css/avtorizacia.css" />
  </head>
  <body>
    <div class="auth-card">
      <div class="tabs">
        <a href="#" class="tab active">ავტორიზაცია</a>
        <a href="registration.html" class="tab">რეგისტრაცია</a>
      </div>

      <div class="field-label">ელ. ფოსტა</div>
      <div class="input-wrap">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            d="M3 6.5c0-.6.4-1 1-1h16c.6 0 1 .4 1 1v11c0 .6-.4 1-1 1H4c-.6 0-1-.4-1-1v-11Z"
          />
          <path d="M4 6l8 6 8-6" />
        </svg>
        <input type="email" placeholder="example@gmail.com" />
      </div>

      <div class="field-label">პაროლი</div>
      <div class="input-wrap">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="4" y="10" width="16" height="10" rx="2" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <input type="password" placeholder="pass****" />
      </div>

      <button class="btn-primary" type="button">ავტორიზაცია</button>

      <div class="forgot">პაროლის აღდგენა</div>
      <div class="divider"></div>

      <button class="btn-social" type="button">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png"
          alt="Facebook"
        />
        ავტორიზაცია FACEBOOK-ით
      </button>

      <button class="btn-social" type="button">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
          alt="Google"
        />
        ავტორიზაცია GOOGLE-ით
      </button>
    </div>
  </body>
</html>
